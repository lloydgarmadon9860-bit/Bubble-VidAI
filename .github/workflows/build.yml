name: Build Bubble VidAI APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - uses: android-actions/setup-android@v3
      - name: Build APK
        run: |
          mkdir -p extracted
          unzip -o Bubble-VidAI-Android-source.zip -d extracted
          cd extracted
          sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
          mkdir -p app/src/main/assets
          mkdir -p app/src/main/res/drawable
          mkdir -p app/src/main/java/cz/bubble/vidai
          cp index.html app/src/main/assets/
          cp icon.png app/src/main/res/drawable/
          cp MainActivity.java app/src/main/java/cz/bubble/vidai/
          cp AndroidManifest.xml app/src/main/
          cp app.gradle app/build.gradle
          gradle :app:assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: Bubble-VidAI-APK
          path: extracted/app/build/outputs/apk/debug/app-debug.apk
